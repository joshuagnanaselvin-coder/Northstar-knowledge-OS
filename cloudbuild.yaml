steps:
  # Build frontend (context = frontend/ directory)
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/northstar-frontend', '-f', 'frontend/Dockerfile', 'frontend']

  # Build backend (context = backend/ directory)
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/northstar-backend', '-f', 'backend/Dockerfile', 'backend']

  # Push images to GCR
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/northstar-frontend']

  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/northstar-backend']

  # Deploy frontend to Cloud Run
  - name: 'gcr.io/cloud-builders/gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'northstar-frontend'
      - '--image=gcr.io/$PROJECT_ID/northstar-frontend'
      - '--platform=managed'
      - '--region=us-central1'
      - '--allow-unauthenticated'
      - '--port=80'
      - '--memory=512Mi'
      - '--cpu=1'
      - '--min-instances=0'
      - '--max-instances=10'

  # Deploy backend to Cloud Run
  - name: 'gcr.io/cloud-builders/gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'northstar-backend'
      - '--image=gcr.io/$PROJECT_ID/northstar-backend'
      - '--platform=managed'
      - '--region=us-central1'
      - '--allow-unauthenticated'
      - '--port=8000'
      - '--memory=512Mi'
      - '--cpu=1'
      - '--min-instances=0'
      - '--max-instances=10'
      - '--set-env-vars=DATABASE_URL=sqlite:///./northstar.db'

images:
  - 'gcr.io/$PROJECT_ID/northstar-frontend'
  - 'gcr.io/$PROJECT_ID/northstar-backend'
