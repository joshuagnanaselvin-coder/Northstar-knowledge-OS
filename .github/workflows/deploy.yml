name: Deploy to GCP VM

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install backend dependencies
        run: |
          cd backend
          pip install fastapi uvicorn sqlalchemy pydantic

      - name: Python syntax check
        run: python -m py_compile backend/main.py

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install frontend dependencies
        run: |
          cd frontend
          npm install

      - name: TypeScript check
        run: cd frontend && npx tsc --noEmit

      - name: Build frontend
        run: cd frontend && npm run build

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to GCP VM via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.GCE_HOST }}
          username: ${{ secrets.GCE_USER }}
          key: ${{ secrets.GCE_SSH_KEY }}
          port: ${{ secrets.GCE_PORT || 22 }}
          script: |
            set -e

            # Install Docker if not present
            if ! command -v docker &> /dev/null; then
              echo "Installing Docker..."
              curl -fsSL https://get.docker.com | sh
              sudo systemctl enable --now docker
              sudo usermod -aG docker $USER
            fi

            # Install Docker Compose plugin if not present
            if ! docker compose version &> /dev/null; then
              echo "Installing Docker Compose..."
              sudo apt-get update -qq
              sudo apt-get install -y -qq docker-compose-plugin
            fi

            # Create app directory
            mkdir -p ~/northstar
            cd ~/northstar

            # Write docker-compose.yml
            cat > docker-compose.yml << 'EOF'
            version: '3.8'
            services:
              backend:
                image: ghcr.io/${{ github.repository }}-backend:latest
                ports:
                  - "8000:8000"
                environment:
                  - DATABASE_URL=sqlite:///./northstar.db
                volumes:
                  - northstar-data:/app
                restart: unless-stopped

              frontend:
                image: ghcr.io/${{ github.repository }}-frontend:latest
                ports:
                  - "80:80"
                depends_on:
                  - backend
                restart: unless-stopped

            volumes:
              northstar-data:
            EOF

            # Pull latest images from GHCR
            docker pull ghcr.io/${{ github.repository }}-backend:latest
            docker pull ghcr.io/${{ github.repository }}-frontend:latest

            # Deploy (create or update containers)
            docker compose up -d --force-recreate --remove-orphans

            # Clean up old dangling images
            docker image prune -f

            # Verify
            sleep 3
            if curl -sf http://localhost/api/health > /dev/null 2>&1; then
              echo "DEPLOY_OK=http://${{ secrets.GCE_HOST }}"
            else
              echo "DEPLOY_CHECK_FAILED"
            fi
