name: Deploy to Google Cloud

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install backend dependencies
        run: |
          cd backend
          pip install fastapi uvicorn sqlalchemy pydantic

      - name: Run Python syntax check
        run: python -m py_compile backend/main.py

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install frontend dependencies
        run: |
          cd frontend
          npm install

      - name: TypeScript check
        run: cd frontend && npx tsc --noEmit

      - name: Build frontend
        run: cd frontend && npm run build

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: ghcr.io/${{ github.repository }}-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: ghcr.io/${{ github.repository }}-frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy to Google Cloud VM via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.GCE_HOST }}
          username: ${{ secrets.GCE_USER }}
          key: ${{ secrets.GCE_SSH_KEY }}
          port: ${{ secrets.GCE_PORT || 22 }}
          script: |
            # Install Docker if not present
            if ! command -v docker &> /dev/null; then
              curl -fsSL https://get.docker.com | sh
              sudo systemctl enable --now docker
            fi

            # Install Docker Compose if not present
            if ! command -v docker compose &> /dev/null; then
              sudo apt-get update
              sudo apt-get install -y docker-compose-plugin
            fi

            # Pull latest images
            docker pull ghcr.io/${{ github.repository }}-backend:latest
            docker pull ghcr.io/${{ github.repository }}-frontend:latest

            # Create/update docker-compose.yml
            mkdir -p ~/northstar
            cat > ~/northstar/docker-compose.yml << 'COMPOSE_EOF'
            version: '3.8'
            services:
              backend:
                image: ghcr.io/${{ github.repository }}-backend:latest
                ports:
                  - "8000:8000"
                environment:
                  - DATABASE_URL=sqlite:///./northstar.db
                volumes:
                  - northstar-data:/app
                restart: unless-stopped
                healthcheck:
                  test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
                  interval: 10s
                  timeout: 5s
                  retries: 5

              frontend:
                image: ghcr.io/${{ github.repository }}-frontend:latest
                ports:
                  - "80:80"
                depends_on:
                  backend:
                    condition: service_healthy
                restart: unless-stopped

            volumes:
              northstar-data:
            COMPOSE_EOF

            # Deploy
            cd ~/northstar
            docker compose up -d --force-recreate --remove-orphans

            # Clean up old images
            docker image prune -f

            echo "Deployment complete! App is running at http://${{ secrets.GCE_HOST }}"
